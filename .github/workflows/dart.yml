name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      
      - run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          set -e
          # Find the Runner.app bundle dynamically
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Runner.app not found"
            exit 1
          fi
          echo "Found Runner.app at: $APP_PATH"

          # Create Payload directory and move app into it
          mkdir -p build/ipa/Payload
          cp -r "$APP_PATH" build/ipa/Payload/

          # Zip into IPA
          cd build/ipa
          zip -qq -r -9 FlutterIpaExport.ipa Payload
          cd ../..
          echo "IPA created at build/ipa/FlutterIpaExport.ipa"

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ipa/FlutterIpaExport.ipa
          tag: v1.0
          overwrite: true
          body: "This is first release"