name: bxc_app_ios
description: Better xCloud for iOS - Enhanced Xbox Cloud Gaming
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  wakelock_plus: ^1.1.4
  shared_preferences: ^2.2.2
  battery_plus: ^6.0.0
  vibration: ^2.0.0
  screen_brightness: ^1.0.1
  volume_controller: ^2.0.7
  image_gallery_saver: ^2.0.3
  http: ^1.2.1
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/userscripts/additional.user.js
    - assets/userscripts/virtual_gamepad.js
